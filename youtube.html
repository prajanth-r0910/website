<!DOCTYPE html>
<html>
    <head>
        <title>YouTube.com Clone</title>
        <style>
            .thumbnail{
                display: block;
                width: 300px;
            }
            .search-bar{
                display: block;
            }
            .video-title {
                font-size: 20px;
                font-weight: bold;
                font-style: italic;
                width: 300px;
                line-height: 24px;
            }

            .video-stats,.video-author {
                display: block;
                color: rgb(96, 96, 69);
                font-size: 14px;
            }

            .video-preview{
                width: 300px;
                display: inline-block;
                vertical-align: top;
                margin-right: 20px;
                margin-left: 20px;
            }
        </style>
    </head>
    <body>
        <input class="search-bar" type="text" placeholder="Search">

        <div class="video-preview">
            <img class="thumbnail" src="thumbnails/thumbnail-1.webp">
            
            <p class="video-title">
                Talking Tech and AI with Google CEO Sundar Pichai!
            </p>
            <p class="video-author">
                Marques Brownlee
            </p>
            <p class="video-stats">
                3.4M views &#183; 6 months ago
            </p>
        </div>

        <div class="video-preview">
            <img class="thumbnail" src="thumbnails/thumbnail-1.webp">

            </p>

            </p>
        </div>
        
    </body>
</html>
